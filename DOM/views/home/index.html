<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda de Videojuegos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="./css/estilos.css" rel="stylesheet" />
  <script src="../../js/datos.js" defer></script>
  <script src="../../js/carrito-data.js" defer></script>
  <script src="../../js/home.js" defer></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">🎮 GameStore</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="../home/index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="../carrito/carrito.html">Carrito 🛒</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <header class="bg-primary text-white text-center py-5 mt-5">
    <h1>Bienvenido a GameStore</h1>
    <p>Explora y compra los mejores videojuegos del momento</p>
  </header>

  <main class="container my-5">
    <div class="row" id="juegos">
      <!-- Aquí se muestran los juegos -->
    </div>
  </main>

<!-- Carrito flotante -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="carritoOffcanvas" aria-labelledby="carritoOffcanvasLabel">
  <div class="offcanvas-header">
    <h5 id="carritoOffcanvasLabel">Tu Carrito</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body" id="carrito-flotante-body">
    <p>Carrito vacío.</p>
  </div>
</div>

  
<!-- Toast container -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999">
  <div id="liveToast" class="toast align-items-center text-bg-success border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toast-body">Acción realizada con éxito.</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

  <footer class="bg-dark text-white text-center py-3">
    <p>&copy; 2025 GameStore. Todos los derechos reservados.</p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/global.js" defer></script>
</body>
</html>
